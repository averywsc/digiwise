.mark{position:fixed;right:22px;bottom:calc(var(--bar) + 18px);width:min(220px,38vw);z-index:2;pointer-events:none;opacity:.92;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}

/* desktop */
.desk{position:fixed;inset:0 0 var(--bar) 0;z-index:3}
.icons{position:absolute;left:10px;top:10px;bottom:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:96px;align-content:start}
.ico{display:grid;justify-items:center;align-content:start;gap:5px;width:92px;height:94px;padding:5px 3px;border:1px solid transparent;border-radius:2px;background:none;color:#fff;text-decoration:none;font-size:.78rem;line-height:1.12;text-align:center;text-shadow:1px 1px 2px #000,0 0 5px #000;cursor:pointer}
.ico:hover,.ico:focus-visible{background:rgba(42,143,120,.65);border:1px dotted rgba(255,255,255,.85)}
.tile{position:relative;display:grid;place-items:center;width:56px;height:56px;border-radius:14px;color:#0b2a22;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2790%27%20height%3D%2790%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%20width%3D%27100%25%27%20height%3D%27100%25%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%201.2%200%200%20-.58%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E"),repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 1px,rgba(255,255,255,0) 1px 4px),radial-gradient(circle at 50% 125%,var(--b) 0,var(--a) 75%);border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),2px 4px 8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.5),inset 0 3px 4px rgba(255,255,255,.55),inset 0 -8px 12px rgba(0,0,0,.3);overflow:hidden}
.tile::before{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:24%;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.65),transparent 70%)}
.tile::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:50%;border-radius:12px 12px 26px 26px/12px 12px 14px 14px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.14))}
.tile svg{position:relative;z-index:1;width:28px;height:28px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7)) drop-shadow(0 -1px 0 rgba(0,0,0,.28))}
.t-games{--a:#c3f9a6;--b:#1f9f54}.t-board{--a:#f5fbff;--b:#5f86a6}.t-mail{--a:#c6f1ff;--b:#1d86bf}.t-ph{--a:#eef2f3;--b:#7f9097}

.widget{position:absolute;right:16px;top:16px;width:236px;padding:0 4px 4px;border-radius:9px 9px 2px 2px;border:1px solid var(--gd);background:var(--g3);box-shadow:4px 6px 18px rgba(0,0,0,.55);overflow:hidden}
.wtb{height:28px;margin:0 -4px;padding:0 10px;display:flex;align-items:center;font:700 .9rem "Trebuchet MS","Fira Sans",Tahoma,sans-serif;color:#fff;text-shadow:1px 1px 0 #0c3d30;background:linear-gradient(180deg,var(--g1) 0,#34b794 9%,#1f9a7b 44%,#1f9a7b 88%,#146f5a 100%);border-radius:8px 8px 0 0}
.widget .in{padding:6px 10px;background:var(--paper);color:var(--ink);border:1px solid var(--gd)}
.lbw,#wl{list-style:none;margin:0;padding:0}
.lbw li,#wl li{display:grid;grid-template-columns:1.6rem 1fr auto;gap:6px;padding:5px 4px;border-bottom:1px solid var(--rule)}
.lbw li:last-child,#wl li:last-child{border-bottom:0}
.lbw li:first-child,#wl li:first-child{font-weight:700;background:#d7f3e6}
.rk{color:#0f7a60;font-weight:700}
.note{color:var(--soft);margin:6px 0 0}

/* windows, XP style frame in Digiwise green */
.win{position:absolute;display:flex;flex-direction:column;padding:0 4px 4px;border-radius:9px 9px 2px 2px;border:1px solid var(--gd);background:var(--fr);box-shadow:4px 6px 18px rgba(0,0,0,.6);overflow:hidden;animation:pop .16s ease both;--tt:#8feacf;--ta:#34b794;--tb:#1f9a7b;--tc:#146f5a;--fr:#1f9a7b}
.win.off .tb{filter:saturate(.4) brightness(1.15)}
.win.mini{opacity:0;transform:scale(.92) translateY(30px);pointer-events:none;visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s .18s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;margin:0 -4px;padding:0 5px 0 9px;cursor:grab;touch-action:none;color:#fff;background:linear-gradient(180deg,var(--tt) 0,var(--ta) 9%,var(--tb) 44%,var(--tb) 88%,var(--tc) 100%);border-radius:8px 8px 0 0}
.ti{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 .95rem "Trebuchet MS","Fira Sans",Tahoma,sans-serif;text-shadow:1px 1px 0 #0c3d30}
.ti .tile{width:20px;height:20px;border-radius:5px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.ti .tile svg{width:12px;height:12px}.ti .tile::after,.ti .tile::before{display:none}
.wc{display:flex;gap:3px}
.wb2{display:grid;place-items:center;width:22px;height:22px;padding:0;border-radius:4px;border:1px solid #fff;color:#fff;background:radial-gradient(circle at 28% 22%,#b6f5e3 0,#37b996 55%,#1a8a6f 100%);box-shadow:inset 0 0 3px rgba(255,255,255,.7);cursor:pointer;text-decoration:none;font:700 .85rem Tahoma,sans-serif;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.wb2.cl{background:radial-gradient(circle at 28% 22%,#ffcfbf 0,#e5643f 55%,#b93b1a 100%)}
.wb2:hover{filter:brightness(1.12)}
.wbody{flex:1;min-height:0;overflow:auto;padding:12px;background:var(--paper);color:var(--ink);border:1px solid var(--gd)}
.wbody.game{padding:0;overflow:hidden}
.wbody iframe{display:block;width:100%;height:100%;border:0;background:#000}
.phb{display:grid;place-items:center;height:100%;min-height:150px;border:2px dashed #9fc3b5;border-radius:6px;color:var(--soft);font-size:1.2rem}
.win.ros{--tt:#7a55e0;--ta:#4a2ba8;--tb:#2d1a6b;--tc:#1f1147;--fr:#2d1a6b;border-color:#140a2e}
.win.fof{--tt:#fff8dc;--ta:#ffeaa6;--tb:#ffd777;--tc:#e9b84a;--fr:#f0c55c;border-color:#1d2b3a}
.win.ros .ti{font-family:Bungee,Impact,sans-serif;font-weight:400;color:#ffd23f;text-shadow:2px 2px 0 #ff3d9a}
.win.fof .ti{font-family:"Russo One",Impact,sans-serif;font-weight:400;color:#ff6b35;-webkit-text-stroke:1px #1d2b3a;paint-order:stroke fill;text-shadow:2px 2px 0 #1d2b3a}

/* game launchers use each game's own look */
.gl{display:grid;gap:14px}
.gt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;text-decoration:none;transition:transform .15s}
.gt:hover{transform:translateY(-2px)}
.gt svg{flex:none;width:64px;height:64px}
.gt span{display:grid;gap:2px}
.gt b{font-size:1.3rem;line-height:1.05}
.gt.ros{background:radial-gradient(260px 120px at 90% -20%,rgba(255,61,154,.35),transparent),#1f1147;border:2px solid #3a2380;box-shadow:0 0 18px rgba(39,225,255,.25)}
.gt.ros b{font-family:Bungee,Impact,sans-serif;font-weight:400;color:#ffd23f;text-shadow:2px 2px 0 #ff3d9a}
.gt.ros small{color:#27e1ff;font-weight:700;font-size:.95rem}
.gt.fof{background:repeating-linear-gradient(135deg,#fff2cc 0 14px,#ffeab0 14px 28px);border:3px solid #1d2b3a;box-shadow:4px 4px 0 #1d2b3a}
.gt.fof b{font-family:"Russo One",Impact,sans-serif;font-weight:400;color:#ff6b35;-webkit-text-stroke:1.5px #1d2b3a;paint-order:stroke fill;text-shadow:3px 3px 0 #1d2b3a}
.gt.fof small{font-family:Nunito,sans-serif;font-weight:800;color:#007f7f;font-size:.95rem}

/* contact popup */
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.people li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:4px;background:#fff;border:1px solid var(--rule)}
.who{display:grid;min-width:0}
.who b{font-weight:700;color:var(--ink);font-size:1rem}
.who span{color:#0f6b57;word-break:break-all;user-select:all;-webkit-user-select:all}
.cp{flex:none;padding:5px 14px;border-radius:3px;border:1px solid #1d5c4e;color:var(--ink);font:inherit;cursor:pointer;background:linear-gradient(180deg,#fff 0,#f1f6f3 86%,#d3ddd8 100%);box-shadow:inset 0 0 0 1px #fff}
.cp:hover{border-color:#2fb592}
.cp:active{background:#dbe7e1}

/* taskbar and start menu */
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:1000;display:flex;align-items:center;gap:6px;padding:0;background:linear-gradient(180deg,#86e6cc 0,#3fc2a1 6%,#22a384 22%,#198f73 52%,#0f6e5a 53%,#12806a 80%,#0d6652 100%);border-top:1px solid #bff8e8;box-shadow:0 -3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.75)}
.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.62) 0,rgba(255,255,255,.22) 60%,rgba(255,255,255,.08) 100%)}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2790%27%20height%3D%2790%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%20width%3D%27100%25%27%20height%3D%27100%25%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%201.2%200%200%20-.58%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E"),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,0) 1px 4px),linear-gradient(180deg,rgba(0,0,0,0) 54%,rgba(0,0,0,.2) 100%)}
.bar>*{position:relative;z-index:1}
#start{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:100%;padding:0 22px 0 14px;border:0;border-radius:0 18px 18px 0;cursor:pointer;color:#fff;font:italic 800 1.4rem "Trebuchet MS","Fira Sans",Tahoma,sans-serif;text-shadow:1px 2px 2px rgba(0,0,0,.6);background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2790%27%20height%3D%2790%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%20width%3D%27100%25%27%20height%3D%27100%25%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%201.2%200%200%20-.58%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E"),linear-gradient(180deg,#c9fbe3 0,#6fe3b0 8%,#33bd86 49%,#1c9a66 50%,#2fc08a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset -2px 0 4px rgba(0,0,0,.3),3px 0 6px rgba(0,0,0,.45)}
#start::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;pointer-events:none;background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.14))}
#start>*{position:relative}
#start:hover{filter:brightness(1.08)}
#start img{height:15px;width:auto;filter:drop-shadow(1px 1px 1px rgba(0,0,0,.5))}
#tasks{flex:1;display:flex;gap:4px;min-width:0;overflow:hidden;padding-left:6px}
.task{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;max-width:170px;min-width:0;height:30px;padding:0 10px;border-radius:3px;border:1px solid #0d6b57;background:linear-gradient(180deg,#7fe0c4 0,#3fc0a0 49%,#1e9a7e 50%,#2bb392 100%);color:#fff;font-size:.85rem;cursor:pointer;white-space:nowrap;text-overflow:ellipsis;text-shadow:1px 1px 0 rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.15)}
.task::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;pointer-events:none;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.08))}
.task>*{position:relative}
.task:hover{filter:brightness(1.08)}
.task.on{background:linear-gradient(180deg,#0d6b57,#1a8f75);box-shadow:inset 1px 1px 4px rgba(0,0,0,.6)}
.task.on::before{opacity:.3}
.tray{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 14px;text-align:right;color:#fff;line-height:1.1;text-shadow:1px 1px 0 rgba(0,0,0,.35);background:linear-gradient(180deg,#52d6b9 0,#25ae90 49%,#0c6f5b 50%,#10806a 100%);border-left:1px solid #0b5a49;box-shadow:inset 1px 0 0 #7ee4cd}
.tray::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;pointer-events:none;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.06))}
.tray>*{position:relative}
.tray small{font-size:.68rem;opacity:.85}
#menu{position:fixed;left:0;bottom:var(--bar);z-index:1001;width:270px;border-radius:8px 8px 0 0;border:1px solid var(--gd);background:var(--paper);overflow:hidden;box-shadow:4px -2px 18px rgba(0,0,0,.6)}
#menu[hidden]{display:none}
.mhd{padding:8px 12px;background:linear-gradient(180deg,#5fd1b5,#1f9a7b 55%,#146f5a)}
.mhd img{display:block;height:52px;width:auto}
.mbd{padding:6px}
#menu .ico{grid-template-columns:36px 1fr;justify-items:start;align-items:center;width:100%;height:auto;padding:5px 8px;text-align:left;color:var(--ink);text-shadow:none;font-size:.95rem;gap:10px}
#menu .ico:hover{background:#2a8f78;color:#fff;border-color:transparent}
#menu .tile{width:34px;height:34px;border-radius:9px}#menu .tile svg{width:18px;height:18px}

@media (max-width:700px){
 .icons{right:10px;grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));grid-auto-columns:auto;bottom:auto}
 .widget{display:none}
 .mark{width:150px}
 .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
 .tb{cursor:default}
 .wb2.mx{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#rain{display:none}}
</style>

function front(o){zi++;o.el.style.zIndex=zi;Object.keys(W).forEach(function(k){W[k].el.classList.toggle("off",W[k]!==o);W[k].tb.classList.toggle("on",W[k]===o)})}
function minimise(o){o.min=true;o.el.classList.add("mini");o.tb.classList.remove("on")}
function restore(o){o.min=false;o.el.classList.remove("mini");front(o)}
function close(o){o.el.remove();o.tb.remove();delete W[o.id]}
function openApp(id){
 var a=APPS[id];if(!a)return;
 var o=W[id];if(!o)o=W[id]=make(id,a);
 if(o.min)restore(o);else front(o);
 $("menu").hidden=true;$("start").setAttribute("aria-expanded","false");
 if(id==="board")paint();
}
document.querySelectorAll("button[data-app]").forEach(function(b){b.addEventListener("click",function(){openApp(b.getAttribute("data-app"))})});
$("start").onclick=function(e){e.stopPropagation();var m=$("menu");m.hidden=!m.hidden;this.setAttribute("aria-expanded",String(!m.hidden))};
document.addEventListener("click",function(e){if(!e.target.closest("#menu")&&!e.target.closest("#start")){$("menu").hidden=true;$("start").setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(!$("menu").hidden){$("menu").hidden=true;return}var top=null;Object.keys(W).forEach(function(k){if(!W[k].min&&(!top||+W[k].el.style.zIndex>+top.el.style.zIndex))top=W[k]});if(top)close(top)});

/* copy an email address */
document.addEventListener("click",function(e){
 var b=e.target.closest(".cp");if(!b)return;
 var t=b.getAttribute("data-c");
 function done(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1400)}
 function fallback(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(x){}a.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else{fallback()}
});

/* leaderboard */
var rows=null,err="";
function fill(ol,list,n){ol.textContent="";list.slice(0,n).forEach(function(r,i){var li=document.createElement("li"),k=document.createElement("span"),a=document.createElement("span"),b=document.createElement("span");k.className="rk";k.textContent=i+1;a.textContent=r.name+" "+r.form;b.textContent=r.total+" pts";li.appendChild(k);li.appendChild(a);li.appendChild(b);ol.appendChild(li)})}
function paint(){
 var msg=err?"The leaderboard isn’t available right now. Tried "+API+"scores.php and got "+err+".":(rows===null?"Loading scores.":(rows.length?"":"No scores yet. Play a game to get on the board."));
 var wl=$("wl"),wn=$("wn");fill(wl,rows||[],5);wn.textContent=msg;wn.hidden=!msg;
 var lw=$("lbw");if(lw){fill(lw,rows||[],20);var ln=$("lbn");ln.textContent=msg;ln.hidden=!msg}
}
function load(){fetch(API+"scores.php").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){rows=d.rows||[];err="";paint()}).catch(function(e){console.error("Leaderboard failed",e);err=e.message;paint()})}
load();paint();
setInterval(function(){if(!document.hidden)load()},60000);

/* clock */
function tick(){var d=new Date();$("clock").textContent=d.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"});$("date").textContent=d.toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"})}
tick();setInterval(tick,15000);

/* falling binary, transparent so the background shows through */
(function(){
 var c=$("rain");
 if(!c||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches))return;
 var x=c.getContext("2d"),fs=18,cols=0,drops=[],act=[],w=0,h=0,last=0,stop=false;
 function size(){
  var r=c.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  w=r.width;h=r.height;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  cols=Math.ceil(w/fs);drops=[];act=[];
  for(var i=0;i<cols;i++){drops[i]=Math.floor(Math.random()*-60);act[i]=Math.random()<.45}
 }
 function frame(t){
  if(stop)return;
  if(t-last>70){
   last=t;
   x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.1)";x.fillRect(0,0,w,h);x.globalCompositeOperation="source-over";
   x.font=fs+"px ui-monospace,Menlo,Consolas,monospace";
   for(var i=0;i<cols;i++){
    if(!act[i])continue;
    if(drops[i]>0){x.fillStyle=Math.random()<.06?"rgba(255,255,255,.95)":"rgba(190,235,215,.5)";x.fillText(Math.random()<.5?"0":"1",i*fs,drops[i]*fs)}
    if(drops[i]*fs>h&&Math.random()>.97)drops[i]=Math.floor(Math.random()*-40);
    drops[i]++;
   }
  }
  requestAnimationFrame(frame);
 }
 var rt;
 window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(size,200)});
 document.addEventListener("visibilitychange",function(){stop=document.hidden;if(!stop)requestAnimationFrame(frame)});
 size();requestAnimationFrame(frame);
})();
</script>
</body>
